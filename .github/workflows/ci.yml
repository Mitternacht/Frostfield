name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Package and lab builds
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | grep -E "macosx|iphonesimulator"

      - name: Require SDKs for the declared platforms
        run: |
          # Package.swift declares iOS 26 and macOS 26. Fail clearly when the
          # selected Xcode cannot build for them instead of failing mid-build.
          for sdk in macosx iphonesimulator; do
            version="$(xcrun --sdk "$sdk" --show-sdk-version)"
            major="${version%%.*}"
            echo "$sdk SDK $version"
            if [ "$major" -lt 26 ]; then
              echo "::error::$sdk SDK $version is older than the declared 26 minimum"
              exit 1
            fi
          done

      # The combined workspace holds the package (shared scheme `Frostfield`)
      # and the FrostfieldLab example app. Package tests run on macOS because
      # they render off-screen on the runner's GPU. The shared schemes set
      # MTL_DEBUG_LAYER=1 so Metal API validation wraps the device; the test
      # steps also pass it to the test runner (TEST_RUNNER_ prefix) together
      # with FROSTFIELD_REQUIRE_API_VALIDATION=1, which makes the validation
      # check fail, not skip, if a run ever lacks the validation layer.
      - name: Build package (macOS Debug)
        run: xcodebuild build -workspace Examples/Frostfield.xcworkspace -scheme Frostfield -destination 'generic/platform=macOS' -configuration Debug CODE_SIGNING_ALLOWED=NO

      - name: Build package (macOS Release)
        run: xcodebuild build -workspace Examples/Frostfield.xcworkspace -scheme Frostfield -destination 'generic/platform=macOS' -configuration Release CODE_SIGNING_ALLOWED=NO

      - name: Build package (iOS Simulator Release)
        run: xcodebuild build -workspace Examples/Frostfield.xcworkspace -scheme Frostfield -destination 'generic/platform=iOS Simulator' -configuration Release CODE_SIGNING_ALLOWED=NO

      - name: Test package (macOS)
        env:
          TEST_RUNNER_MTL_DEBUG_LAYER: "1"
          TEST_RUNNER_FROSTFIELD_REQUIRE_API_VALIDATION: "1"
        run: xcodebuild test -workspace Examples/Frostfield.xcworkspace -scheme Frostfield -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO

      # FF-04 experiment (not shipped): conventional versus Metal 4 output and
      # lifetime tests. Metal 4 cases skip on a GPU without the Metal 4 family.
      - name: Test Metal 4 experiment (macOS)
        env:
          TEST_RUNNER_MTL_DEBUG_LAYER: "1"
          TEST_RUNNER_FROSTFIELD_REQUIRE_API_VALIDATION: "1"
        run: xcodebuild test -workspace Examples/Frostfield.xcworkspace -scheme Metal4ComparisonTests -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO

      - name: Build Metal 4 benchmark tool (macOS)
        run: xcodebuild build -workspace Examples/Frostfield.xcworkspace -scheme Metal4Benchmark -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO

      # Builds the example app and its UI tests without running them; UI tests
      # need a booted simulator and are run locally through Xcode.
      - name: Build lab app and UI tests (iOS Simulator)
        run: xcodebuild build-for-testing -workspace Examples/Frostfield.xcworkspace -scheme FrostfieldLab -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
